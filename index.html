<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบแก้ไขข้อมูลเสื้อ BU JERSEY</title>
  
  <!-- Favicon -->
  <link rel="icon" href="https://www.bu.ac.th/dist/images/favicon.ico">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #c2e9fb;
      font-family: 'Prompt', sans-serif;
    }
    .container {
      max-width: 480px;
      margin: 50px auto;
      padding: 20px;
    }
    .card-custom {
      border-radius: 12px;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
    }
    .btn-custom {
      width: 100%;
      font-size: 18px;
      border-radius: 30px;
      padding: 10px;
      transition: transform 0.2s ease, background-color 0.3s ease;
    }
    .btn-custom:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }
    h2, h5 {
      font-weight: 600;
      color: #343a40;
    }
    footer {
      background-color: #343a40;
      border-radius: 8px;
      padding: 15px;
      margin-top: 30px;
      text-align: center;
    }
    footer p {
      margin: 0;
      font-size: 0.9rem;
      color: #fff;
    }
    footer a {
      color: #ffc107;
      text-decoration: none;
    }
    /* Loading Spinner */
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      display: none;
    }
  </style>

  <script>
    // กำหนด API URL เพียงครั้งเดียว
    const apiUrl = "https://sheet-api.smobu.cloud/proxy";

    // ฟังก์ชันค้นหาข้อมูล (GET)
    function searchData() {
      var inputValue = document.getElementById('inputM').value.trim();

      if (!inputValue) {
        Swal.fire('ข้อผิดพลาด', 'กรุณากรอกหมายเลขธุรกรรมหรือเลขรายการบนสลิปโอนเงิน', 'error');
        return;
      }

      // แสดง Loading
      document.getElementById('loading').style.display = 'block';

      // เรียก API ผ่าน Proxy
      fetch(`${apiUrl}?m=${encodeURIComponent(inputValue)}`, {
        method: "GET",
        mode: 'cors', // ใช้ CORS ที่รองรับ
      })
      .then(response => response.json())  // แปลงข้อมูลจาก JSON
      .then(data => {
        document.getElementById('loading').style.display = 'none'; // ซ่อน Loading
        showResult(data);
      })
      .catch(error => {
        document.getElementById('loading').style.display = 'none'; // ซ่อน Loading
        Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
      });
    }

    // แสดงผลข้อมูลที่ค้นหา
    function showResult(data) {
      if (!data || !data.J) {
        // ถ้าไม่พบข้อมูลหรือค่า `J` ไม่มี (หมายถึงไม่พบข้อมูลที่ต้องการ)
        Swal.fire('ไม่พบข้อมูล', '', 'error');
        return;
      }

      if (data.V === 'สั่งผลิตแล้ว' || data.V === 'รับเสื้อแล้ว') {
        Swal.fire('แจ้งเตือน', 'ข้อมูลนี้ ' + data.V + ' ไม่สามารถแก้ไขได้', 'warning');
        return;
      }

      // แสดงข้อมูล
      document.getElementById('result').innerHTML = `
        <div class="card card-custom mt-4">
          <h5 class="text-center mb-3">ข้อมูลเสื้อ BU JERSEY</h5>
          <div class="mb-2"><strong>ชื่อผู้สั่งซื้อ</strong> ${data.J}</div>
          <div class="mb-2">
            <strong>ตัวหนังสือหลังเสื้อ</strong>
            <input type="text" id="editL" class="form-control" value="${data.L}" maxlength="8"
                   pattern="[A-Za-z]{1,8}" title="กรอกเฉพาะตัวอักษร A-Z ไม่เกิน 8 ตัว" required>
          </div>
          <div class="mb-2">
            <strong>สีเสื้อ</strong>
            <select id="editD" class="form-control">
              <option ${data.D === 'สีฟ้า' ? 'selected' : ''}>สีฟ้า</option>
              <option ${data.D === 'สีแดง' ? 'selected' : ''}>สีแดง</option>
              <option ${data.D === 'สีกรม' ? 'selected' : ''}>สีกรม</option>
              <option ${data.D === 'สีดำ' ? 'selected' : ''}>สีดำ</option>
            </select>
          </div>
          <div class="mb-2">
            <strong>เบอร์เสื้อ</strong>
            <input type="number" id="editE" class="form-control" min="1" max="99" value="${data.E}">
          </div>
          <div class="mb-3">
            <strong>ไซต์เสื้อ</strong>
            <input type="text" id="editF" class="form-control" value="${data.F}" disabled>
          </div>
          <button class="btn btn-primary btn-custom" onclick="updateData('${data.M}')">อัปเดต</button>
        </div>`;
    }

    // ฟังก์ชันอัปเดตข้อมูล (POST)
    function updateData(M) {
      var L = document.getElementById('editL').value;
      var D = document.getElementById('editD').value;
      var E = document.getElementById('editE').value.padStart(2, '0');

      // แสดง Loading
      document.getElementById('loading').style.display = 'block';

      fetch(apiUrl, {
        method: "POST",
        mode: 'cors', // ใช้ CORS ที่รองรับ
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ m: M, l: L, d: D, e: E })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none'; // ซ่อน Loading
        Swal.fire('อัปเดตข้อมูลสำเร็จ', '', 'success');

        // รีเซ็ตข้อมูล
        document.getElementById('inputM').value = '';  // เคลียร์ช่องค้นหา
        document.getElementById('result').innerHTML = '';  // เคลียร์ผลการค้นหา
      })
      .catch(error => {
        document.getElementById('loading').style.display = 'none'; // ซ่อน Loading
        Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
      });
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="text-center mb-4">
      <h2 class="animate__animated animate__fadeInDown">ระบบแก้ไขข้อมูลเสื้อ BU JERSEY</h2>
    </div>
    <div class="card card-custom animate__animated animate__zoomIn">
      <div class="mb-3">
        <input type="text" id="inputM" class="form-control" placeholder="หมายเลขธุกรรม/เลขรายการบนสลิปโอนเงิน">
      </div>
      <button class="btn btn-success btn-custom" onclick="searchData()">ค้นหา</button>
    </div>
    <div id="result"></div>

    <!-- Loading Spinner -->
    <div id="loading" class="loading">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <footer>
      <p>
        Developed by Technologies Team, Secretary Department<br>
        V.3 Student Union of Bangkok University<br>
        หากพบปัญหากรุณาติดต่อไลน์ <a href="https://line.me/ti/p/~@125jhxql" target="_blank">@smo_bu</a>
      </p>
    </footer>
  </div>
</body>
</html>

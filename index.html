<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'self' https://jersey.smobu.cloud;">
  <title>ระบบแก้ไขข้อมูลเสื้อ BU JERSEY</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #c2e9fb;
      font-family: 'Prompt', sans-serif;
    }
    .container {
      max-width: 480px;
      margin: 50px auto;
      padding: 20px;
    }
    .card-custom {
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      border: none;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
    }
    .btn-custom {
      width: 100%;
      font-size: 18px;
      border-radius: 30px;
      padding: 10px;
      transition: transform 0.2s ease, background-color 0.3s ease;
    }
    .btn-custom:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }
    .form-control {
      border-radius: 8px;
    }
    h2, h5 {
      font-weight: 600;
      color: #343a40;
    }
    .card-animate {
      animation: fadeInUp 0.8s;
    }
    footer {
      background-color: #343a40;
      border-radius: 8px;
      padding: 15px;
      margin-top: 30px;
      text-align: center;
      color: #fff;
    }
  </style>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyxWZbUdGuwLNXZoU-nCyU-Kq9BqiRBzghRH9KmINf5WwQf8tkFJ4SdZIVW9P-ElOR8/exec";

    async function searchData() {
      let inputValue = document.getElementById('inputM').value.trim();
      if (!inputValue) {
        Swal.fire('กรุณากรอกรหัสธุรกรรม', '', 'warning');
        return;
      }

      try {
        let response = await fetch(`${API_URL}?id=${encodeURIComponent(inputValue)}`);
        let data = await response.json();

        if (data && data.J) {
          if (data.V === 'สั่งผลิตแล้ว' || data.V === 'รับเสื้อแล้ว') {
            Swal.fire('แจ้งเตือน', 'ข้อมูลนี้ ' + data.V + ' ไม่สามารถแก้ไขได้', 'warning');
            return;
          }
          document.getElementById('result').innerHTML = `
            <div class="card card-custom card-animate mt-4">
              <h5 class="text-center mb-3">ข้อมูลเสื้อ BU JERSEY</h5>
              <div class="mb-2"><strong>J:</strong> ${data.J}</div>
              <div class="mb-2">
                <strong>L:</strong>
                <input type="text" id="editL" class="form-control" value="${data.L}" maxlength="8"
                       pattern="[A-Za-z]{1,8}" title="กรอกเฉพาะตัวอักษร A-Z ไม่เกิน 8 ตัว" required>
              </div>
              <div class="mb-2">
                <strong>D:</strong>
                <select id="editD" class="form-control">
                  <option ${data.D === 'สีฟ้า' ? 'selected' : ''}>สีฟ้า</option>
                  <option ${data.D === 'สีแดง' ? 'selected' : ''}>สีแดง</option>
                  <option ${data.D === 'สีกรม' ? 'selected' : ''}>สีกรม</option>
                  <option ${data.D === 'สีดำ' ? 'selected' : ''}>สีดำ</option>
                </select>
              </div>
              <div class="mb-2">
                <strong>E:</strong>
                <input type="number" id="editE" class="form-control" min="1" max="99" value="${data.E}">
              </div>
              <div class="mb-3">
                <strong>F:</strong>
                <input type="text" class="form-control" value="${data.F}" disabled>
              </div>
              <button class="btn btn-primary btn-custom" onclick="updateData('${data.J}')">อัปเดต</button>
            </div>`;
        } else {
          Swal.fire('ไม่พบข้อมูล', '', 'error');
        }
      } catch (error) {
        Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
      }
    }

    async function updateData(J) {
      let D = document.getElementById('editD').value;
      let E = document.getElementById('editE').value.padStart(2, '0');

      let payload = { J, D, E };

      try {
        let response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        let result = await response.text();
        Swal.fire(result, '', result.includes('สำเร็จ') ? 'success' : 'warning');
      } catch (error) {
        Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
      }
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="text-center mb-4">
      <h2 class="animate__animated animate__fadeInDown">ระบบแก้ไขข้อมูลเสื้อ BU JERSEY</h2>
    </div>
    <div class="card card-custom animate__animated animate__zoomIn">
      <div class="mb-3">
        <input type="text" id="inputM" class="form-control" placeholder="รหัสธุรกรรม/เลขรายการบนสลิปโอนเงิน">
      </div>
      <button class="btn btn-success btn-custom" onclick="searchData()">ค้นหา</button>
    </div>
    <div id="result"></div>
    <footer>
      <p>
        Developed by Technologies Team, Secretary Department<br>
        V.3 Student Union of Bangkok University<br>
        หากพบปัญหากรุณาติดต่อไลน์ <a href="https://line.me/ti/p/~smo_bu" target="_blank">@smo_bu</a>
      </p>
    </footer>
  </div>
</body>
</html>

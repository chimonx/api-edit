<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบแก้ไขข้อมูลเสื้อ BU JERSEY</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Prompt', sans-serif; background: #c2e9fb; }
    .container { max-width: 480px; margin: 50px auto; padding: 20px; }
    .card-custom { border-radius: 12px; border: none; background: rgba(255, 255, 255, 0.9); padding: 20px; }
    .btn-custom { width: 100%; font-size: 18px; border-radius: 30px; padding: 10px; transition: transform 0.2s ease, background-color 0.3s ease; }
    .btn-custom:hover { background-color: #0056b3; transform: scale(1.05); }
    footer { background-color: #343a40; border-radius: 8px; padding: 15px; margin-top: 30px; text-align: center; color: #fff; }
    footer a { color: #ffc107; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-center mb-4">
      <h2>ระบบแก้ไขข้อมูลเสื้อ BU JERSEY</h2>
    </div>
    <div class="card card-custom">
      <div class="mb-3">
        <input type="text" id="inputM" class="form-control" placeholder="หมายเลขธุรกรรม/เลขรายการบนสลิป">
      </div>
      <button class="btn btn-success btn-custom" onclick="searchData()">ค้นหา</button>
    </div>
    <div id="result"></div>
    <footer>
      <p>หากพบปัญหาติดต่อไลน์ <a href="https://line.me/ti/p/~@125jhxql" target="_blank">@smo_bu</a></p>
    </footer>

    <script>
      // ใส่ URL ของ Web App ที่ deploy แล้ว (ตรวจสอบว่าเปิดให้ "Anyone, even anonymous")
      const API_URL = "https://script.google.com/macros/s/AKfycbwCdNMQRSDGOPxx4UX4X9Hlm9hkjynFW9_cOHr3jDr1FpINi9JXmylKobpdwQUbftYx/exec";

      // ฟังก์ชันค้นหาข้อมูล (GET) โดยใช้ no-cors mode
      function searchData() {
        let inputValue = document.getElementById('inputM').value.trim();
        if (!inputValue) {
          Swal.fire('ข้อผิดพลาด', 'กรุณากรอกหมายเลขธุรกรรม', 'error');
          return;
        }
        fetch(API_URL + "?m=" + encodeURIComponent(inputValue), {
          method: "GET",
          mode: 'no-cors' // ไม่ให้เบราว์เซอร์ตรวจสอบ CORS
        })
        .then(response => {
          // response จะเป็น opaque response ไม่สามารถอ่าน JSON ได้
          console.log("Opaque response (GET):", response);
          Swal.fire("Request Sent", "GET Request sent in no-cors mode.\n(response not available)", "info");
        })
        .catch(error => Swal.fire('เกิดข้อผิดพลาด', error.message, 'error'));
      }

      // ฟังก์ชันส่งข้อมูลแก้ไข (POST) โดยใช้ no-cors mode
      function updateData(M) {
        let L = document.getElementById('editL').value.trim();
        let D = document.getElementById('editD').value;
        let E = document.getElementById('editE').value.padStart(2, '0');

        fetch(API_URL, {
          method: "POST",
          mode: 'no-cors', // ไม่ให้เบราว์เซอร์ตรวจสอบ CORS
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ m: M, l: L, d: D, e: E })
        })
        .then(response => {
          console.log("Opaque response (POST):", response);
          Swal.fire("Request Sent", "POST Request sent in no-cors mode.\n(response not available)", "info");
        })
        .catch(error => Swal.fire('เกิดข้อผิดพลาด', error.message, 'error'));
      }
    </script>
  </div>
</body>
</html>

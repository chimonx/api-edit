<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบแก้ไขข้อมูลเสื้อ BU JERSEY</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Prompt', sans-serif; background: #c2e9fb; }
    .container { max-width: 480px; margin: 50px auto; padding: 20px; }
    .card-custom { border-radius: 12px; border: none; background: rgba(255, 255, 255, 0.9); padding: 20px; }
    .btn-custom { width: 100%; font-size: 18px; border-radius: 30px; padding: 10px; transition: transform 0.2s ease, background-color 0.3s ease; }
    .btn-custom:hover { background-color: #0056b3; transform: scale(1.05); }
    footer { background-color: #343a40; border-radius: 8px; padding: 15px; margin-top: 30px; text-align: center; color: #fff; }
    footer a { color: #ffc107; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-center mb-4">
      <h2>ระบบแก้ไขข้อมูลเสื้อ BU JERSEY</h2>
    </div>
    <div class="card card-custom">
      <div class="mb-3">
        <input type="text" id="inputM" class="form-control" placeholder="หมายเลขธุรกรรม/เลขรายการบนสลิป">
      </div>
      <button class="btn btn-success btn-custom" onclick="searchData()">ค้นหา</button>
    </div>
    <div id="result"></div>
    <footer>
      <p>หากพบปัญหาติดต่อไลน์ <a href="https://line.me/ti/p/~@125jhxql" target="_blank">@smo_bu</a></p>
    </footer>

    <script>
      // ใส่ URL ของ Web App ที่ deploy แล้ว (ตรวจสอบว่าเปิดให้ "Anyone, even anonymous")
      const API_URL = "https://proxy-uk1x.onrender.com";

      // ฟังก์ชันค้นหาข้อมูล (GET) โดยใช้ cors mode
      function searchData() {
        let inputValue = document.getElementById('inputM').value.trim();
        if (!inputValue) {
          Swal.fire('ข้อผิดพลาด', 'กรุณากรอกหมายเลขธุรกรรม', 'error');
          return;
        }
        fetch(API_URL + "/proxy?m=" + encodeURIComponent(inputValue), {
          method: "GET",
          mode: 'cors' // ใช้ CORS ที่รองรับ
        })
        .then(response => response.json()) // แปลงข้อมูลจาก JSON
        .then(data => {
          console.log(data);  // แสดงข้อมูลที่ได้รับจาก API
          showResult(data);  // แสดงผลข้อมูล
        })
        .catch(error => Swal.fire('เกิดข้อผิดพลาด', error.message, 'error'));
      }

      // ฟังก์ชันแสดงผลข้อมูล
      function showResult(data) {
        if (data) {
          if (data.V === 'สั่งผลิตแล้ว' || data.V === 'รับเสื้อแล้ว') {
            Swal.fire('แจ้งเตือน', 'ข้อมูลนี้ ' + data.V + ' ไม่สามารถแก้ไขได้', 'warning');
            return;
          }
          document.getElementById('result').innerHTML = `
            <div class="card card-custom mt-4">
              <h5 class="text-center mb-3">ข้อมูลเสื้อ BU JERSEY</h5>
              <div class="mb-2"><strong>ชื่อผู้สั่งซื้อ</strong> ${data.J}</div>
              <div class="mb-2">
                <strong>ตัวหนังสือหลังเสื้อ</strong>
                <input type="text" id="editL" class="form-control" value="${data.L}" maxlength="8"
                       pattern="[A-Za-z]{1,8}" title="กรอกเฉพาะตัวอักษร A-Z ไม่เกิน 8 ตัว" required>
              </div>
              <div class="mb-2">
                <strong>สีเสื้อ</strong>
                <select id="editD" class="form-control">
                  <option ${data.D === 'สีฟ้า' ? 'selected' : ''}>สีฟ้า</option>
                  <option ${data.D === 'สีแดง' ? 'selected' : ''}>สีแดง</option>
                  <option ${data.D === 'สีกรม' ? 'selected' : ''}>สีกรม</option>
                  <option ${data.D === 'สีดำ' ? 'selected' : ''}>สีดำ</option>
                </select>
              </div>
              <div class="mb-2">
                <strong>เบอร์เสื้อ</strong>
                <input type="number" id="editE" class="form-control" min="1" max="99" value="${data.E}">
              </div>
              <div class="mb-3">
                <strong>ไซต์เสื้อ</strong>
                <input type="text" id="editF" class="form-control" value="${data.F}" disabled>
              </div>
              <button class="btn btn-primary btn-custom" onclick="updateData('${data.M}')">อัปเดต</button>
            </div>`;
        } else {
          Swal.fire('ไม่พบข้อมูล', '', 'error');
        }
      }

      // ฟังก์ชันส่งข้อมูลแก้ไข (POST) โดยใช้ cors mode
      function updateData(M) {
        let L = document.getElementById('editL').value;
        let D = document.getElementById('editD').value;
        let E = document.getElementById('editE').value.padStart(2, '0');

        fetch(API_URL + "/proxy", {
          method: "POST",
          mode: 'cors', // ใช้ CORS ที่รองรับ
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ m: M, l: L, d: D, e: E })
        })
        .then(response => response.json()) // แปลงข้อมูลจาก JSON
        .then(data => {
          console.log(data);  // แสดงข้อมูลที่ได้รับจาก API
          Swal.fire("Data updated", JSON.stringify(data), "info");
        })
        .catch(error => Swal.fire('เกิดข้อผิดพลาด', error.message, 'error'));
      }
    </script>
  </div>
</body>
</html>

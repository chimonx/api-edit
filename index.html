<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบแก้ไขข้อมูลเสื้อ BU JERSEY</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; }
    .container { max-width: 500px; margin: 50px auto; padding: 20px; background: white; border-radius: 10px; }
    .btn-custom { width: 100%; font-size: 18px; padding: 10px; }
  </style>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzq-S25NEnkrlj-KzMY4vlFJj7l7S43-X7MIcwrIbj9Mg1auw5_72ZxX8bPakhUepIg/exec";

    async function searchData() {
      var inputValue = document.getElementById('inputM').value.trim();
      if (!inputValue) {
        Swal.fire("ข้อผิดพลาด", "กรุณากรอกหมายเลขธุรกรรม", "error");
        return;
      }

      let response = await fetch(API_URL + "?m=" + encodeURIComponent(inputValue));
      let data = await response.json();

      if (data.status === "success") {
        if (data.V === "สั่งผลิตแล้ว" || data.V === "รับเสื้อแล้ว") {
          Swal.fire("แจ้งเตือน", "ข้อมูลนี้ " + data.V + " ไม่สามารถแก้ไขได้", "warning");
          return;
        }

        document.getElementById("result").innerHTML = `
          <h5>ข้อมูลเสื้อ BU JERSEY</h5>
          <p><strong>ชื่อผู้สั่งซื้อ:</strong> ${data.J}</p>
          <label><strong>ตัวหนังสือหลังเสื้อ:</strong></label>
          <input type="text" id="editL" class="form-control" value="${data.L}" maxlength="8" required>
          
          <label><strong>สีเสื้อ:</strong></label>
          <select id="editD" class="form-control">
            <option ${data.D === "สีฟ้า" ? "selected" : ""}>สีฟ้า</option>
            <option ${data.D === "สีแดง" ? "selected" : ""}>สีแดง</option>
            <option ${data.D === "สีกรม" ? "selected" : ""}>สีกรม</option>
            <option ${data.D === "สีดำ" ? "selected" : ""}>สีดำ</option>
          </select>
          
          <label><strong>เบอร์เสื้อ:</strong></label>
          <input type="number" id="editE" class="form-control" min="1" max="99" value="${data.E}">

          <button class="btn btn-primary btn-custom mt-3" onclick="updateData('${data.M}')">อัปเดต</button>
        `;
      } else {
        Swal.fire("ไม่พบข้อมูล", "", "error");
      }
    }

    async function updateData(M) {
      var L = document.getElementById('editL').value;
      var D = document.getElementById('editD').value;
      var E = document.getElementById('editE').value.padStart(2, '0');

      let response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ m: M, l: L, d: D, e: E })
      });

      let result = await response.json();
      Swal.fire(result.message, "", result.status === "success" ? "success" : "warning");
    }
  </script>
</head>
<body>
  <div class="container">
    <h2 class="text-center">ระบบแก้ไขข้อมูลเสื้อ BU JERSEY</h2>
    <input type="text" id="inputM" class="form-control" placeholder="หมายเลขธุรกรรม">
    <button class="btn btn-success btn-custom mt-2" onclick="searchData()">ค้นหา</button>
    <div id="result" class="mt-3"></div>
  </div>
</body>
</html>
